<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" direction="rtl" font-family="Segoe UI, Tahoma, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1500" height="760" fill="#ffffff"/>
<text x="750.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">المثال الفعلي WO-2026-000001 — المراحل والأرقام</text>
<rect x="30" y="60" width="1440" height="330" rx="14" fill="#e0e7ff" opacity="0.55"/>
<text x="1454" y="86" text-anchor="start" font-size="16" font-weight="700" fill="#1e293b">تعريف العملية v1 (ما رأيناه في الشاشة)</text>
<rect x="1190" y="110" width="250" height="110" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="1315.0" y="149.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MOD — تصنيع وحدة الإضاءة</text>
<text x="1315.0" y="170.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">يستهلك: WT-LED × 4 لكل لمبة</text>
<text x="1315.0" y="191.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">ينتج: WT-MODULE (وسيط)</text>
<rect x="850" y="110" width="250" height="110" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="975.0" y="149.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ASM — تجميع اللمبة</text>
<text x="975.0" y="170.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">يستهلك: وحدة + غلاف</text>
<text x="975.0" y="191.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">ينتج: WT-LAMP (نهائي)</text>
<rect x="510" y="110" width="250" height="110" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="635.0" y="149.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">QC — فحص الجودة</text>
<text x="635.0" y="170.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">اختيارية · مرتان كحد أقصى</text>
<text x="635.0" y="191.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">لا تستهلك ولا تنتج</text>
<line x1="1190" y1="165" x2="1100" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1145.0" y="159.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">بعد</text>
<line x1="850" y1="165" x2="760" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<text x="805.0" y="159.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">بعد</text>
<text x="760" y="262" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">للأمر 10 لمبات: LED = 40 · غلاف = 10 (الوحدة الوسيطة تُصنع داخل الأمر ولا تُصرف من المخزن)</text>
<rect x="1190" y="285" width="250" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
<text x="1315.0" y="324.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">WT-LED × 40</text>
<text x="1315.0" y="345.5" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">تكلفة 2.00 = 80.00</text>
<rect x="850" y="285" width="250" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
<text x="975.0" y="324.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">WT-MODULE × 10</text>
<text x="975.0" y="345.5" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">يحمل 80.00 (8.00 للوحدة)</text>
<rect x="510" y="285" width="250" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
<text x="635.0" y="324.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">WT-CASE × 10</text>
<text x="635.0" y="345.5" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">تكلفة 5.00 = 50.00</text>
<rect x="170" y="285" width="270" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
<text x="305.0" y="324.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">WT-LAMP: 9 سليمة + 1 هالك</text>
<text x="305.0" y="345.5" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">الوعاء كله 130.00</text>
<line x1="1190" y1="330" x2="1100" y2="330" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1145.0" y="324.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">يصنع</text>
<line x1="510" y1="330" x2="440" y2="330" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<text x="475.0" y="324.0" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">مع الوحدة</text>
<rect x="30" y="410" width="1440" height="330" rx="14" fill="#fef3c7" opacity="0.55"/>
<text x="1454" y="436" text-anchor="start" font-size="16" font-weight="700" fill="#1e293b">الأثر المحاسبي الفعلي (من قاعدة البيانات)</text>
<rect x="1130" y="470" width="310" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<text x="1285.0" y="514.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">صرف الخامات</text>
<text x="1285.0" y="535.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">مدين 1150 WIP 130.00</text>
<text x="1285.0" y="556.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">دائن 1120 المخزون 130.00</text>
<rect x="790" y="470" width="310" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<text x="945.0" y="514.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">الهالك (1 من 10 = 10%)</text>
<text x="945.0" y="535.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">مدين 5299 مصروف هالك 13.00</text>
<text x="945.0" y="556.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">دائن 1150 WIP 13.00</text>
<rect x="450" y="470" width="310" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<text x="605.0" y="514.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">استلام 9 لمبات</text>
<text x="605.0" y="535.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">مدين 1120 المخزون 117.00</text>
<text x="605.0" y="556.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">دائن 1150 WIP 117.00</text>
<rect x="110" y="470" width="310" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="265.0" y="514.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">النتيجة</text>
<text x="265.0" y="535.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">WIP = 0.00 · لمبة = 13.00</text>
<text x="265.0" y="556.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">المخزون 9 × 13.00 = 117.00</text>
<text x="750" y="640" text-anchor="middle" font-size="15" fill="#78350f" font-weight="700">الحساب: 130.00 ÷ 10 وحدات مخططة = 13.00 للوحدة. الهالك أخذ وحدة واحدة (13.00) والباقي 117.00 ÷ 9 = 13.00</text>
<text x="750" y="675" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="400">ملاحظة: سجل المراحل (الشاشة) يعرض ناتج ASM بقيمة 130.00 لأنه لا يخصم الهالك — الدفاتر هي المرجع (117.00 + 13.00)</text>
</svg>