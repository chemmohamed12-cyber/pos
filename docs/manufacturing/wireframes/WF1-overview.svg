<text x="265" y="676" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">مكتمل</text>
<text x="700" y="760" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">كل رقم هنا يقود إلى قائمة مصفّاة؛ لا لوحة مؤشرات تزيينية. تُعرض فقط الأرقام المتاحة من الواجهات الحالية.</text>
