<text x="675" y="465" text-anchor="start" font-size="14" fill="#0f172a" font-weight="700">أحداث مالية مرفوضة (تصنيع)</text>
<text x="675" y="500" text-anchor="start" font-size="26" fill="#0f172a" font-weight="700">‪1‬</text>
<text x="400" y="500" text-anchor="start" font-size="13" fill="#2563eb" font-weight="700">عرض ‹</text>
<rect x="50" y="430" width="310" height="90" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="345" y="465" text-anchor="start" font-size="14" fill="#0f172a" font-weight="700">وحدات معلّقة / مرفوضة بلا حسم</text>
<text x="345" y="500" text-anchor="start" font-size="26" fill="#0f172a" font-weight="700">‪0‬</text>
<text x="70" y="500" text-anchor="start" font-size="13" fill="#2563eb" font-weight="700">عرض ‹</text>
<text x="1350" y="560" text-anchor="start" font-size="18" fill="#0f172a" font-weight="700">آخر ما اكتمل</text>
<rect x="30" y="575" width="1340" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1340" y="605" text-anchor="start" font-size="13" fill="#64748b" font-weight="700">رقم الأمر</text>
<text x="1125" y="605" text-anchor="start" font-size="13" fill="#64748b" font-weight="700">المنتج</text>
