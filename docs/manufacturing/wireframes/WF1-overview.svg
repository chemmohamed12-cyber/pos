<text x="1005" y="465" text-anchor="start" font-size="14" fill="#0f172a" font-weight="700">عمليات معلّقة بانتظار سابقتها</text>
<text x="1005" y="500" text-anchor="start" font-size="26" fill="#0f172a" font-weight="700">‪1‬</text>
<text x="730" y="500" text-anchor="start" font-size="13" fill="#2563eb" font-weight="700">عرض ‹</text>
