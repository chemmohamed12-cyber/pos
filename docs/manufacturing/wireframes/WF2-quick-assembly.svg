<text x="690" y="392" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">‪148‬</text>
<text x="470" y="392" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">‪0‬</text>
<text x="250" y="392" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">متوفر</text>
<text x="1350" y="432" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">WT-CASE غلاف</text>
