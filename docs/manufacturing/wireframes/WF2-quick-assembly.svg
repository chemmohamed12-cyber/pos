<text x="250" y="472" text-anchor="start" font-size="13" fill="#b91c1c" font-weight="700">ناقص</text>
<text x="1350" y="520" text-anchor="start" font-size="12" fill="#b91c1c" font-weight="400">عند وجود نقص: يُعطَّل «تأكيد التجميع» ويظهر السبب والكمية الناقصة قبل أي تنفيذ.</text>
<rect x="30" y="560" width="660" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
