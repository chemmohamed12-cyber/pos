<text x="910" y="432" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">قطعة</text>
<text x="690" y="432" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">‪88‬</text>
<text x="470" y="432" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">‪0‬</text>
<text x="250" y="432" text-anchor="start" font-size="13" fill="#0f172a" font-weight="400">متوفر</text>
