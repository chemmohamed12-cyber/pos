<text x="1310" y="181" text-anchor="start" font-size="13" fill="#475569" font-weight="400">WT-LAMP — لمبة اختبار الدليل</text>
<text x="1320" y="208" text-anchor="start" font-size="11" fill="#64748b" font-weight="400">يظهر فقط ما له قائمة مواد نشطة. غير المؤهل يُعرض معطّلًا مع السبب.</text>
<text x="760" y="150" text-anchor="start" font-size="13" fill="#334155" font-weight="700">الكمية المطلوب تجميعها *</text>
