<text x="760" y="208" text-anchor="start" font-size="11" fill="#64748b" font-weight="400">بوحدة: قطعة (عدد صحيح)</text>
<text x="520" y="150" text-anchor="start" font-size="13" fill="#334155" font-weight="700">المستودع المصدر *</text>
