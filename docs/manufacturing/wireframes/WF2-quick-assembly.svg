<text x="1350" y="620" text-anchor="start" font-size="13" fill="#334155" font-weight="400">أمر التصنيع: WO-2026-000002 (مكتمل)</text>
<text x="1350" y="646" text-anchor="start" font-size="13" fill="#334155" font-weight="400">المنتَج فعليًا: 2 · المستهلك فعليًا: LED 12 · غلاف 2</text>
<text x="1350" y="672" text-anchor="start" font-size="13" fill="#334155" font-weight="400">التكلفة من السجلات: 34.00 = 17.00 للوحدة</text>
<text x="1350" y="698" text-anchor="start" font-size="13" fill="#334155" font-weight="400">تنبيهات: لا يوجد</text>
<text x="700" y="840" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">لا رسم بياني ولا مراحل في هذا المسار. التنفيذ معاملة واحدة؛ الزر يُعطَّل أثناء الإرسال لمنع التكرار.</text>
