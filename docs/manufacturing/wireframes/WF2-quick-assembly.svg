<text x="670" y="620" text-anchor="start" font-size="13" fill="#334155" font-weight="400">المنتج: WT-LAMP × 2 قطعة</text>
<text x="670" y="646" text-anchor="start" font-size="13" fill="#334155" font-weight="400">يخرج من 1001: LED 12 · غلاف 2</text>
<text x="670" y="672" text-anchor="start" font-size="13" fill="#334155" font-weight="400">يدخل 1001: لمبة 2</text>
<text x="670" y="698" text-anchor="start" font-size="13" fill="#334155" font-weight="400">تكلفة المواد التقديرية: 34.00 (من المتوسط الحالي)</text>
