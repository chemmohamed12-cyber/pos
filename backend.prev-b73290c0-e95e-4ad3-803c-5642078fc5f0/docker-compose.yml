# Local development only — not a deployment artifact.
# Provides the PostgreSQL instance for Stage 2 build-order item 3
# (Daii/planning/stage-2/STAGE_2_BUILD_ORDER.md). See
# Daii/architecture/DAII_ONPREM_LAN_ARCHITECTURE.md for how this same
# Postgres engine is hosted differently (managed vs. self-hosted)
# across Cloud/On-Premise/LAN without any application-code change.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daii
      POSTGRES_PASSWORD: daii_dev_only
      POSTGRES_DB: daii_dev
    ports:
      - '5432:5432'
    volumes:
      - daii_postgres_data:/var/lib/postgresql/data

volumes:
  daii_postgres_data:
